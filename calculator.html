<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <script src="calculator.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
           
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .calculator{
            width:360px;
            background:#fff;
            padding:20px;
            border:2px solid #444;
            border-radius:15px;
        }

        h1{
            text-align:center;
            margin-bottom:15px;
            color:#222;
        }

        table{
            width:100%;
            border-spacing:8px;
        }

        #result{
            width:100%;
            height:50px;
            font-size:22px;
            text-align:right;
            padding-right:10px;
            border:1px solid #444;
            border-radius:5px;
        }

        input[type="button"]{
            width:100%;
            height:50px;
            font-size:20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            background:#e5e7eb;
        }

        input[type="button"]:hover{
            opacity:0.9;
        }

        .operator{
            background:#99f6e4;
            font-weight:bold;
        }

        .clear{
            background:#fd74e2;
            font-weight:bold;
        }

        .equal{
            background:#86efac;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h1>Calculator</h1>

    <table>
        <tr>
            <td colspan="3">
                <input type="text" id="result" readonly>
            </td>
            <td>
                <input type="button" value="C" class="clear" onclick="clr()">
            </td>
        </tr>

        <tr>
            <td><input type="button" value="1" onclick="dis('1')"></td>
            <td><input type="button" value="2" onclick="dis('2')"></td>
            <td><input type="button" value="3" onclick="dis('3')"></td>
            <td><input type="button" value="/" class="operator" onclick="dis('/')"></td>
        </tr>

        <tr>
            <td><input type="button" value="4" onclick="dis('4')"></td>
            <td><input type="button" value="5" onclick="dis('5')"></td>
            <td><input type="button" value="6" onclick="dis('6')"></td>
            <td><input type="button" value="-" class="operator" onclick="dis('-')"></td>
        </tr>

        <tr>
            <td><input type="button" value="7" onclick="dis('7')"></td>
            <td><input type="button" value="8" onclick="dis('8')"></td>
            <td><input type="button" value="9" onclick="dis('9')"></td>
            <td><input type="button" value="+" class="operator" onclick="dis('+')"></td>
        </tr>

        <tr>
            <td><input type="button" value="." onclick="dis('.')"></td>
            <td><input type="button" value="0" onclick="dis('0')"></td>
            <td><input type="button" value="=" class="equal" onclick="solve()"></td>
            <td><input type="button" value="*" class="operator" onclick="dis('*')"></td>
        </tr>
    </table>
</div>

</body>
</html>
